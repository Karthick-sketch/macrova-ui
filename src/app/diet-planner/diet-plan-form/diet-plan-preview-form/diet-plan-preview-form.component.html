<div class="form-container">
  <div class="page-header">
    <h2>Create Diet Plan</h2>
  </div>

  <div class="form-card">
    <div class="field-group">
      <p>Daily Calories {{ dietPlan().deficit | number }} kcal</p>
    </div>
    <div class="field-group">
      <p>Diet Type {{ dietPlan().mealType }}</p>
    </div>
    <div class="field-group">
      <p>Meals {{ dietPlan().numberOfMeals }} per day</p>
    </div>
    <div class="field-group">
      <p>Evening Snack {{ dietPlan().eveningSnack ? "Yes" : "No" }}</p>
    </div>
    <div class="field-group">
      <p>Duration {{ dietPlan().duration }} days</p>
    </div>

    <div class="form-footer">
      <button class="submit-btn" (click)="createDiet()">
        Generate My Diet Plan
      </button>
    </div>
  </div>
</div>
